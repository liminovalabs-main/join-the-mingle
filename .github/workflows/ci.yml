name: CI / Automated Quality & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/local.txt

      - name: Run Pytest
        env:
          USE_SQLITE: "1"
          DJANGO_SECRET_KEY: "ci-secret-key-for-automated-testing-only"
          DJANGO_SETTINGS_MODULE: "config.settings.local"
        run: |
          cd backend
          pytest tests/ -v

  test-frontend:
    name: Frontend Vitest & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Run Vitest Suite
        run: |
          cd frontend
          npm test -- --run

      - name: Verify Next.js Production Build
        env:
          NEXT_PUBLIC_API_URL: "https://mingler.co.uk/api/v1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          cd frontend
          npm run build
