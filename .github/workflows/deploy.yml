name: Deploy to Hostinger VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI / Automated Quality & Test Suite"]
    branches: [main]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH Automated Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: SSH deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_KEY" ]; then
            echo "Skipping SSH deploy: VPS_HOST or VPS_SSH_KEY secrets not yet configured."
            echo "Add secrets in GitHub Repo Settings > Secrets and variables > Actions."
            exit 0
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" > "$HOME/.ssh/id_ed25519"
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            "${VPS_USER:-root}@$VPS_HOST" \
            'bash /opt/mingler/scripts/deploy.sh'
