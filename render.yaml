# ============================================================
# Render Infrastructure Blueprint — Project Mingler Staging
# ============================================================
# Docs: https://render.com/docs/blueprint-spec

services:
  # ──────────────────────────────────────────────
  # Django DRF Web API Service
  # ──────────────────────────────────────────────
  - type: web
    name: mringle-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    healthCheckPath: /api/v1/venues/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mringle-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"

databases:
  # ──────────────────────────────────────────────
  # PostgreSQL Database Instance
  # ──────────────────────────────────────────────
  - name: mringle-db
    databaseName: mingler_db
    user: mingler_user
    plan: free
    region: frankfurt
